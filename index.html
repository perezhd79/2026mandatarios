<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestoría Automotor - Sistema Inteligente de Presupuestos</title>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GestorAuto">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/0f2744/f59e0b?text=GA">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'media',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } }
        }
      }
    }
  </script>
  <style>
    @media print {
      body * { visibility: hidden !important; }
      body { background-color: white !important; }
      #printable-budget, #printable-budget * { 
        visibility: visible !important; 
        color: black !important; 
      }
      #printable-budget { 
        position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 20px; box-shadow: none; background: white !important;
      }
      .no-print, #btn-back-to-top, #loader-overlay { display: none !important; }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #475569; }
  </style>
</head>

<body class="h-full font-sans text-slate-800 dark:text-slate-200 antialiased flex flex-col relative">

  <!-- Loader Overlay -->
  <div id="loader-overlay" class="fixed inset-0 z-[100] bg-slate-900/80 backdrop-blur-sm hidden flex-col items-center justify-center text-white transition-opacity duration-300 opacity-0">
    <i class="fa-solid fa-circle-notch fa-spin text-5xl text-brand-500 mb-4"></i>
    <h2 class="text-xl font-bold">Generando Documento...</h2>
    <p class="text-sm text-slate-300 mt-2">Preparando formato de impresión y PDF</p>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Botón Volver Arriba -->
  <button id="btn-back-to-top" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="fixed bottom-6 right-6 z-40 bg-brand-600 text-white w-12 h-12 rounded-full shadow-lg items-center justify-center hover:bg-brand-500 transition-all duration-300 transform translate-y-20 opacity-0 flex hidden cursor-pointer">
    <i class="fa-solid fa-arrow-up text-lg"></i>
  </button>

  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 sm:gap-3 min-w-0">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center text-slate-950 font-black shadow-lg shrink-0">
          <i class="fa-solid fa-car text-base sm:text-xl"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 sm:gap-2">
            <span class="font-bold text-sm sm:text-lg tracking-tight text-white truncate">GestorAuto Pro</span>
          </div>
          <p class="text-[11px] text-slate-400 hidden md:block truncate">Panel de Presupuestos DNRPA & DGR</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <!-- ACTUALIZADO: Llama a createNewBudget -->
        <button onclick="createNewBudget()" class="px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-brand-600 text-white hover:bg-brand-500 transition shadow-sm flex items-center gap-1.5">
          <i class="fa-solid fa-calculator text-xs sm:text-sm"></i> <span class="hidden sm:inline">Nuevo</span>
        </button>
        <button onclick="switchView('history')" class="px-2.5 sm:px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 transition flex items-center gap-1.5">
          <i class="fa-solid fa-folder-open text-xs sm:text-sm"></i> <span class="hidden sm:inline">Historial</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 lg:p-8 pb-24 lg:pb-8">

    <div id="view-creator" class="space-y-4 sm:space-y-5">
      <!-- Top Summary Metrics Bar -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5 sm:gap-4">
        <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-2.5 sm:gap-3 transition-colors">
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center text-sm sm:text-lg shrink-0">
            <i class="fa-solid fa-file-invoice-dollar"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[10px] sm:text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider truncate">DNRPA + Tasas</p>
            <h4 id="kpi-subtotal-registral" class="text-sm sm:text-lg font-bold text-slate-900 dark:text-white truncate">\$0</h4>
          </div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-2.5 sm:gap-3 transition-colors">
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-purple-50 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 flex items-center justify-center text-sm sm:text-lg shrink-0">
            <i class="fa-solid fa-building-columns"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[10px] sm:text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider truncate">Impuesto Sellos</p>
            <h4 id="kpi-dgr-corrientes" class="text-sm sm:text-lg font-bold text-slate-900 dark:text-white truncate">\$0</h4>
          </div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-2.5 sm:gap-3 transition-colors">
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 flex items-center justify-center text-sm sm:text-lg shrink-0">
            <i class="fa-solid fa-user-tie"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[10px] sm:text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider truncate">Honorarios</p>
            <h4 id="kpi-honorarios" class="text-sm sm:text-lg font-bold text-slate-900 dark:text-white truncate">\$0</h4>
          </div>
        </div>
        <div class="bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex items-center gap-2.5 sm:gap-3 transition-colors">
          <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-sm sm:text-lg shrink-0">
            <i class="fa-solid fa-money-bill-wave"></i>
          </div>
          <div class="min-w-0">
            <p class="text-[10px] sm:text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider truncate">Total General</p>
            <h4 id="kpi-total-general" class="text-base sm:text-xl font-extrabold text-emerald-600 dark:text-emerald-400 truncate">\$0</h4>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        <div class="lg:col-span-7 space-y-6">

          <!-- Card 1: Cliente & Radicación -->
          <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm overflow-hidden transition-colors">
            <div class="px-5 py-4 bg-slate-50/80 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-6 h-6 rounded-full bg-brand-600 text-white text-xs flex items-center justify-center font-bold">1</span>
                <h3 class="font-semibold text-slate-800 dark:text-white">Datos del Cliente & Jurisdicción</h3>
              </div>
            </div>
            <div class="p-5 grid grid-cols-1 sm:grid-cols-2 gap-4">
              <!-- Datos Titular -->
              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Nombre y Apellido *</label>
                <div class="relative">
                  <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-user text-sm"></i></span>
                  <input type="text" id="client-name" placeholder="Ej: Juan Ramón Ramírez" class="w-full pl-9 pr-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 focus:
